(function(){
  var sid=new URLSearchParams(location.search).get("session_id");
  if(!/^cs_(live|test)_/.test(sid||""))return; // pas un vrai paiement Stripe : on n'envoie rien
  var key="tint_purchase_"+sid;
  try{if(localStorage.getItem(key))return}catch(e){}
  if(window.fbq){fbq("track","Purchase",{value:297,currency:"EUR"},{eventID:sid});}

})();
